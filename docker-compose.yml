services:
  db:
    image: pgvector/pgvector:pg16
    container_name: plagiarism-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plagiarism_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-plagiarism_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: plagiarism-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-plagiarism_db}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgvector_data:
